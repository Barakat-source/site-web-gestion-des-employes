<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulaire Inscription</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="particles"></div>
  <div class="form-container">
    <h2>Inscription</h2>
    <form action="insert.php" method="POST">
      
      <label for="first_name">Prénom</label>
      <input type="text" id="first_name" name="first_name" required placeholder="Ton prénom" />

      <label for="last_name">Nom</label>
      <input type="text" id="last_name" name="last_name" required placeholder="Ton nom" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="ton@email.com" />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required placeholder="Ton mot de passe" />

      <button type="submit">Lancer vers la base 🚀</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
